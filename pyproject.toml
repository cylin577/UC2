[project]
name = "uc2"
version = "0.1.0"
description = "UC2 (TAS & Event Replay)"
requires-python = ">=3.10"
dependencies = [
    "opencv-python",
    "pyqt6==6.7.1",
    "numpy",
    "pyyaml",
    "pygame",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
]

[tool.uv]
package = false
